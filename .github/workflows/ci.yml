name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime: npm
      node-version: "22.12.0"
      install-policy: "project"
      timeout-minutes: 20
      browser: chromium
      pre-command: |
        npm run build
        ./node_modules/.bin/wrangler deploy --dry-run
      command: npm test
      artifact-name: worker-dist
      artifact-path: dist/
      artifact-retention-days: 14
