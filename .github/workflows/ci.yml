name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      package-manager: npm
      node-version: "22.12.0"
      runtime-version: "11.19.1"
      install-policy: "project"
      typecheck: false
      lint: false
      unit: false
      security: false
      disabled-check-reasons: |-
        {
          "typecheck": "tsc --noEmit runs inside npm run build",
          "lint": "project has no lint script",
          "unit": "Playwright browser suite is the test gate",
          "security": "previous CI had no gitleaks/osv jobs"
        }
      l3: true
      l3-command: "npm test"
      l3-browser: "chromium"
      build: true
      build-command: |
        npm run build
        ./node_modules/.bin/wrangler deploy --dry-run
      artifact-name: worker-dist
      artifact-paths: dist/
