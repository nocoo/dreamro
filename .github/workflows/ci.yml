name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, browser tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Validate Worker package
        run: npx wrangler deploy --dry-run
      - name: Upload verified Worker assets
        uses: actions/upload-artifact@v4
        with:
          name: worker-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
